name: Sync Obsidian & deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [obsidian-update]
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout private Obsidian vault
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.OBSIDIAN_REPO }}
          token: ${{ secrets.OBSIDIAN_TOKEN }}
          path: obsidian-vault
          fetch-depth: 0 # 完整历史：同步脚本用 git 首次提交日期推导笔记创建时间

      - name: Install dependencies
        run: npm ci

      - name: Sync notes from vault
        run: node scripts/sync-obsidian.mjs obsidian-vault

      - name: Build site
        env:
          ASTRO_BASE: /izwarm/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
